# Cloud Resilience Visualizer — scheduled compliance audit
#
# Runs a real (non-mock) scan against a tagged AWS project on a
# weekly schedule and uploads the resulting evidence record straight
# to a private S3 bucket in the same AWS account — never to a GitHub
# Actions artifact. This repo is public, and GitHub Actions artifacts
# on a public repo are downloadable by any GitHub account, not just
# collaborators — a real client's security posture must never pass
# through that surface. Authenticates to AWS via OIDC; no long-lived
# AWS credentials are stored anywhere. The tag value being audited,
# and the confidential control-catalogue file, are repository
# secrets, never committed to this repo, so no client name or
# real-account data appears anywhere in this repo or its logs.
#
# One-time AWS-side setup required before this can run (not part of
# this repo):
#   1. An IAM OIDC identity provider for
#      token.actions.githubusercontent.com.
#   2. An IAM role (CRV-SecurityAudit-ReadOnly) trusting it, scoped to
#      this repo/branch, with the AWS-managed SecurityAudit policy
#      attached (read-only).
#   3. A private S3 bucket (block all public access, default
#      encryption on) and one additional inline policy on that same
#      role granting s3:PutObject scoped only to that bucket's ARN --
#      nothing else. The role's read access to the rest of the
#      account stays exactly SecurityAudit, unchanged.
#
# Repository secrets required:
#   AWS_AUDIT_ROLE_ARN       -- ARN of the IAM role to assume via OIDC
#   AUDIT_PROJECT_TAG        -- "Key=Value" tag scoping the scan, e.g.
#                               "Project=<tag-value>"
#   CONFIDENTIAL_PROJECT_TAG -- (optional) the tag VALUE (not
#                               "Key=Value") that unlocks the
#                               confidential framework -- see
#                               app/api/main.py's _is_confidential_scope
#   CONFIDENTIAL_CONTROLS_JSON -- (optional) full JSON content of
#                               confidential_controls.json. Written to
#                               disk only for the duration of this
#                               job; never committed. Omit both this
#                               and CONFIDENTIAL_PROJECT_TAG if this
#                               engagement has no confidential
#                               framework to include.
# Repository variables required:
#   AWS_REGION           -- region the audited resources live in
#   EVIDENCE_S3_BUCKET   -- name of the private S3 bucket to upload to

name: Weekly compliance audit

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    name: Run scheduled audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_AUDIT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Write confidential control catalogue (if configured)
        env:
          CONFIDENTIAL_CONTROLS_JSON: ${{ secrets.CONFIDENTIAL_CONTROLS_JSON }}
        run: |
          # The "secrets" context isn't available in step-level "if:"
          # conditions at all (GitHub Actions restriction) -- so the
          # optionality is handled here in the shell instead, via the
          # "env" context, which is allowed everywhere.
          if [ -n "$CONFIDENTIAL_CONTROLS_JSON" ]; then
            printf '%s' "$CONFIDENTIAL_CONTROLS_JSON" > app/mappings/confidential_controls.json
          fi

      - name: Run audit
        env:
          AUDIT_PROJECT_TAG: ${{ secrets.AUDIT_PROJECT_TAG }}
          CONFIDENTIAL_PROJECT_TAG: ${{ secrets.CONFIDENTIAL_PROJECT_TAG }}
          AUDIT_OUTPUT_PATH: evidence-report.json
        run: python scripts/run_scheduled_audit.py

      - name: Upload evidence record to private S3
        env:
          BUCKET: ${{ vars.EVIDENCE_S3_BUCKET }}
        run: |
          aws s3 cp evidence-report.json \
            "s3://$BUCKET/evidence-reports/$(date -u +%Y/%m/%d)-${{ github.run_id }}.json"
