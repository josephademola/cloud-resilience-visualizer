<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resilience Visualizer</title>

    <!-- Inter font from Google Fonts (display=swap for performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet stylesheet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Tabler Icons webfont -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/dist/tabler-icons.min.css">

    <!-- App stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="app-sidebar" aria-label="Section navigation">
        <div class="sidebar-brand">
            <span class="app-title-icon" aria-hidden="true">
                <i class="ti ti-shield-check"></i>
            </span>
            <span class="sidebar-brand-text">Cloud Resilience<span>Visualizer</span></span>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <button class="sidebar-nav-btn sidebar-nav-btn-active" data-view="dashboard">
                <i class="ti ti-layout-dashboard"></i><span>Dashboard</span>
            </button>
            <button class="sidebar-nav-btn" data-view="assets">
                <i class="ti ti-affiliate"></i><span>Assets</span>
            </button>
            <button class="sidebar-nav-btn" data-view="findings">
                <i class="ti ti-list-details"></i><span>Findings</span>
            </button>
            <button class="sidebar-nav-btn" data-view="compliance">
                <i class="ti ti-checklist"></i><span>Compliance</span>
            </button>
            <button class="sidebar-nav-btn" data-view="evidence">
                <i class="ti ti-file-certificate"></i><span>Evidence</span>
            </button>
        </nav>
    </aside>

    <div class="app-main">
        <header class="app-topbar">
            <h1 class="app-topbar-title" id="topbar-title">Dashboard</h1>

            <input type="file" id="snapshot-file-input" accept="application/json" hidden>
            <button id="load-report-btn" class="download-btn" type="button">
                <i class="ti ti-file-upload"></i>
                Load report file
            </button>

            <div class="app-status" id="status" role="status" aria-live="polite">
                Loading...
            </div>
        </header>

        <section id="dashboard-view" class="view view-active" aria-label="Dashboard view">
            <div id="dashboard-view-content" class="dashboard-view-content">
                <div class="compliance-loading">Loading dashboard...</div>
            </div>
        </section>

        <section id="assets-view" class="view" aria-label="Assets view">
            <div id="map" class="topology-map"></div>
        </section>

        <section id="findings-view" class="view" aria-label="Findings view">
            <div id="findings-view-content" class="findings-view-content"></div>
        </section>

        <section id="compliance-view" class="view" aria-label="Compliance view">
            <div id="compliance-dashboard" class="compliance-dashboard"></div>
        </section>

        <section id="evidence-view" class="view" aria-label="Evidence view">
            <div class="view-stub">Evidence record — coming soon.</div>
        </section>
    </div>

    <!-- Details panel: slides in from the right on node click -->
    <aside id="details-panel" class="details-panel" aria-hidden="true" aria-label="Resource details">
        <button id="details-close" class="details-close" aria-label="Close details">&times;</button>
        <div id="details-content"></div>
    </aside>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App logic -->
    <script src="js/topology.js"></script>
    <script src="js/compliance.js"></script>
    <script src="js/findings.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
